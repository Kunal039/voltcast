# Central configuration for the VoltCast (Household Electricity Consumption Prediction) pipeline.
data:
  url: "https://archive.ics.uci.edu/static/public/235/individual+household+electric+power+consumption.zip"
  raw_csv: data/household_power_consumption.csv
  processed: data/processed/hourly.parquet
  features: data/processed/features.parquet
  serving: data/serving/recent_hourly.csv
  web_data: web/public/data/dashboard.json
  resample_rule: "1h"
  max_interp_gap_hours: 6

split:
  # Chronological split: no shuffling, so no future data leaks into training.
  train_end: "2009-12-31 23:00:00"
  val_end: "2010-05-31 23:00:00"

features:
  target: Global_active_power
  lags: [1, 2, 3, 6, 12, 24, 48, 168]
  rolling_windows: [3, 6, 24, 168]

# Default hyper-parameters of each candidate (keys match the model names used in MLflow).
# Every candidate is an algorithm from the MLOps-1 syllabus (Units 1-2).
models:
  linear_regression: {}
  ridge_regression:
    alpha: 1.0
  decision_tree:
    random_state: 42
  knn:
    n_neighbors: 10
  svm:
    C: 1.0
    epsilon: 0.1
  random_forest:
    n_estimators: 200
    max_depth: 16
    min_samples_leaf: 5
    n_jobs: -1
    random_state: 42

# GridSearchCV with time-series cross-validation (folds never train on the future).
tuning:
  cv_splits: 5
  scoring: neg_mean_absolute_error
  grids:
    ridge_regression:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
    decision_tree:
      max_depth: [4, 6, 8, 10, 14, null]
      min_samples_leaf: [1, 10, 50, 100]
    knn:
      n_neighbors: [5, 10, 20, 40]
      weights: [uniform, distance]
    random_forest:
      max_depth: [10, 16, null]
      min_samples_leaf: [1, 5, 20]

# Peak-hour alert: classify whether the next hour is a high-consumption hour.
classification:
  threshold_quantile: 0.75   # of training-period consumption
  decision_tree:
    random_state: 42
  random_forest:
    n_estimators: 200
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
    random_state: 42
  grid:
    max_depth: [3, 5, 7, 9, 12, null]
    min_samples_leaf: [1, 10, 50, 100]
    class_weight: [null, balanced]

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment: household-electricity-forecasting
  registered_model: voltcast-forecaster

monitoring:
  psi_threshold: 0.2
  mae_degradation_pct: 20
