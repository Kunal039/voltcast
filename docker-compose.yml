services:
  api:
    build: .
    ports: ["8000:8000"]
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
  mlflow:
    build: .
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000
    volumes: ["./mlflow.db:/app/mlflow.db", "./mlruns:/app/mlruns"]
    ports: ["5000:5000"]
