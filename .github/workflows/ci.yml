name: CI / CT pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # weekly continuous-training run
  workflow_dispatch:

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Reproduce the DVC pipeline (ingest -> train -> classify -> monitor -> evaluate -> export)
        run: dvc repro --force
      - name: Show metrics tracked by DVC
        run: dvc metrics show

      - name: Quality gate - forecaster must beat the persistence baseline
        run: |
          python -c "import json,sys; m=json.load(open('models/metadata.json')); \
          sys.exit(0 if m['test_metrics']['mae'] < m['baseline_test_metrics']['mae'] else 1)"
      - name: Quality gate - peak classifier must beat chance (ROC-AUC > 0.75)
        run: |
          python -c "import json,sys; c=json.load(open('reports/classification.json')); \
          sys.exit(0 if c['test']['roc_auc'] > 0.75 else 1)"

      - name: Unit and API tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build React web app (into public/, used by Docker and Vercel)
        run: cd web && npm ci && npm run build

      - name: Validate Docker Compose, Prometheus/Grafana and Kubernetes configs
        run: |
          docker compose config -q
          python -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml') + glob.glob('monitoring/**/*.yml', recursive=True)]"
      - name: Build Docker image
        run: docker build -t voltcast:${{ github.sha }} .

      - uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            dvc.lock
